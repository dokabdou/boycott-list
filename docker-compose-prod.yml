services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-app-network

  backend:
    image: boycott-list-backend:latest
    restart: unless-stopped
    container_name: backend_boycott_list
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
        - SPRING_PROFILES_ACTIVE=dev
        - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
        - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update
        - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
        # Notification vars
        - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
        - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO}
        - NOTIFICATION_EMAIL_ENABLED=true
        - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
        - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
        - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
        - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
        - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
        - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
    networks:
      - internal-app-network
      - proxy-network

  frontend:
    image: boycott-list-frontend:latest
    restart: unless-stopped
    container_name: frontend_boycott_list
    ports:
      - "4200:4200"
    networks:
      - proxy-network
      - internal-app-network

networks:
  proxy-network:
    external: true
  internal-app-network:
    driver: bridge

volumes:
  pg-data: