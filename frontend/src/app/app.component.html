<nav class="navbar">
	<div class="nav-links">
		<a routerLink="/" class="nav-brand">The BoyCott List</a>
		<a routerLink="/submit" class="nav-link">Submit</a>

		@if (isLoggedIn()) {
			<a routerLink="/admin" class="nav-link">Admin</a>
			<a (click)="logout()" class="nav-link logout-link">Logout</a>
		} @else {
			<a routerLink="/login" class="nav-link">Admin Login</a>
		}
		<!-- <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle dark mode">
		@if (themeService.isDark()) {
			<span>☀️</span>
		} @else {
			<span>🌙</span>
		}
	</button> -->
	</div>

	<!-- Search bar pushed to the right -->
	<div class="search-container">
		<!-- <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle dark mode">
		@if (themeService.isDark()) {
			<span>☀️</span>
		} @else {
			<span>🌙</span>
		}
	</button> -->
		<span class="search-icon">🔍</span>
		<input
			type="text"
			placeholder="Search by name, tag, category, poster…"
			[(ngModel)]="searchTerm"
			(input)="onSearchInput(searchTerm)"
			class="search-input"
		/>
		@if (searchTerm) {
			<button class="clear-btn" (click)="clearSearch()">✕</button>
		}
	</div>
</nav>

<div class="page-content">
	<router-outlet />
</div>

<!-- Scroll to top button -->
<button
	class="scroll-to-top-btn"
	[class.dragging]="isDragging()"
	(click)="scrollToTop()"
	(mousedown)="startDrag($event)"
	(touchstart)="startDrag($event)"
	[style.left.px]="btnX()"
	[style.top.px]="btnY()"
	title="Back to top (drag to move)"
>
	↑
</button>

@if (toastMessage) {
	<div class="toast">
		{{ toastMessage }}
		<button (click)="closeToast()">✕</button>
	</div>
}
