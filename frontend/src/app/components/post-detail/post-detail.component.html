<div class="page-content">
	<ng-container *ngIf="banner() as b">
		<div class="banner-fixed" [class.success-banner]="b.type === 'success'" [class.failure-banner]="b.type === 'error'">
			<span [innerHTML]="b.message"></span>
			<button class="close-btn" (click)="banner.set(null)">✕</button>
		</div>
	</ng-container>
  <div *ngIf="post() as p; else loading">
    <!-- Admin buttons -->
    <div class="admin-post-actions" *ngIf="isLoggedIn() && editingPostId() !== p.id">
      <button mat-raised-button color="primary" (click)="startEdit(p)">
        <mat-icon>edit</mat-icon> Edit
      </button>
      <button mat-raised-button color="warn" (click)="deletePost()">
        <mat-icon>delete</mat-icon> Delete
      </button>
    </div>

    <!-- Display mode -->
    <div *ngIf="editingPostId() !== p.id">
      <h1 class="company-name">{{ p.companyName }}</h1>
      <div class="category-chip" *ngIf="p.category">
        <mat-chip class="category-chip-item">{{ p.category }}</mat-chip>
      </div>
      <mat-chip-listbox class="tags">
        <mat-chip *ngFor="let tag of p.tags">{{ tag }}</mat-chip>
      </mat-chip-listbox>

      <div class="content-row">
        <div class="description-box">
          <mat-card>
            <mat-card-content>
              <p>{{ p.description }}</p>
            </mat-card-content>
          </mat-card>

          <div class="highlights" *ngIf="p.highlights && p.highlights.length">
            <h3>Highlights</h3>
            <div class="highlight-boxes">
              <div *ngFor="let box of p.highlights" class="highlight-box">
                <ul>
                  <li *ngFor="let item of box">{{ item }}</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="sources" *ngIf="p.sourceLinks?.length">
            <h3>Sources</h3>
            <ul>
              <li *ngFor="let link of p.sourceLinks">
                <a [href]="link" target="_blank">{{ link }}</a>
              </li>
            </ul>
          </div>
        </div>

        <div class="comment-box">
          <app-comment-section [postId]="p.id!"></app-comment-section>
        </div>
      </div>
      <app-suggestion-section [postId]="p.id!"></app-suggestion-section>
    </div>

    <!-- Edit mode -->
	<div *ngIf="editingPostId() === p.id && editForm" class="edit-post-wrapper">
	<mat-card class="edit-post-card">
		<mat-card-header>
		<mat-card-title>Edit Post</mat-card-title>
		</mat-card-header>
		<mat-card-content>
		<form [formGroup]="editForm">
			<!-- Company Name -->
			<mat-form-field appearance="fill" class="full-width">
			<mat-label>Company Name</mat-label>
			<input matInput formControlName="companyName" required>
			</mat-form-field>

			<!-- Category -->
			<mat-form-field appearance="fill" class="full-width">
			<mat-label>Category</mat-label>
			<input matInput formControlName="category">
			</mat-form-field>

			<!-- Description -->
			<mat-form-field appearance="fill" class="full-width">
			<mat-label>Description</mat-label>
			<textarea matInput formControlName="description" rows="3" required></textarea>
			</mat-form-field>

			<!-- Source Links -->
			<div formArrayName="sourceLinks">
			<div *ngFor="let link of sourceLinksArray.controls; let i = index"
				style="display: flex; align-items: center; gap: 8px;">
				<mat-form-field appearance="fill" class="full-width">
				<mat-label>Source Link {{ i + 1 }}</mat-label>
				<input matInput [formControlName]="i" placeholder="https://...">
				</mat-form-field>
				<button mat-icon-button color="warn" type="button"
						(click)="removeLink(i)"
						*ngIf="sourceLinksArray.length > 1">
				<mat-icon>delete</mat-icon>
				</button>
			</div>
			<button mat-stroked-button type="button" (click)="addLink()" style="margin-bottom: 5px;">Add link</button>
			</div>

			<!-- Tags -->
			<mat-form-field appearance="fill" class="full-width">
			<mat-label>Tags (comma separated)</mat-label>
			<input matInput formControlName="tags" placeholder="environment, labor, ...">
			</mat-form-field>

			<!-- Highlights -->
			<mat-form-field appearance="fill" class="full-width">
			<mat-label>Highlights</mat-label>
			<textarea matInput formControlName="highlights" rows="4"
						placeholder="Each line = one box, items separated by |&#10;e.g.&#10;Item 1|Item 2|Item 3&#10;Other|Box items"></textarea>
			</mat-form-field>

			<!-- Actions -->
			<div class="edit-actions">
			<button mat-raised-button color="primary" (click)="saveEdit(p.id!)">Save</button>
			<button mat-button (click)="cancelEdit()">Cancel</button>
			</div>
		</form>
		</mat-card-content>
	</mat-card>
	</div>
  </div>

  <ng-template #loading>
    <p>Loading post...</p>
  </ng-template>
</div>
