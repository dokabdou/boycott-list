<div class="comment-section">
  <h3>Comments</h3>

  <!-- New comment form -->
  <div class="new-comment">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Your name</mat-label>
      <input matInput [(ngModel)]="newComment.author">
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Write a comment...</mat-label>
      <textarea matInput rows="2" [(ngModel)]="newComment.content"></textarea>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="addTopLevelComment()"
            [disabled]="!newComment.author.trim() || !newComment.content.trim()">
      Post Comment
    </button>
  </div>

  <!-- Comments list -->
  <div class="comments-list" *ngIf="topLevelComments.length">
    <div *ngFor="let comment of topLevelComments" class="comment-thread">
      <div class="comment-card">
        <div class="comment-header">
          <strong>{{ comment.author }}</strong>
          <span class="comment-date">{{ comment.createdAt | date:'short' }}</span>
        </div>
        <p>{{ comment.content }}</p>
        <button mat-button color="accent" (click)="startReply(comment.id)">
          Reply
        </button>

        <!-- Reply form inline -->
        <div *ngIf="replyTo === comment.id" class="reply-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Your name</mat-label>
            <input matInput [(ngModel)]="replyAuthor">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Your reply</mat-label>
            <textarea matInput rows="2" [(ngModel)]="replyContent"></textarea>
          </mat-form-field>
          <button mat-raised-button color="primary" (click)="submitReply()"
                  [disabled]="!replyAuthor.trim() || !replyContent.trim()">
            Submit Reply
          </button>
          <button mat-button (click)="cancelReply()">Cancel</button>
        </div>
      </div>

      <!-- Nested replies -->
      <div class="replies" *ngIf="getReplies(comment.id).length">
        <div *ngFor="let reply of getReplies(comment.id)" class="reply-card">
          <div class="comment-header">
            <strong>{{ reply.author }}</strong>
            <span class="comment-date">{{ reply.createdAt | date:'short' }}</span>
          </div>
          <p>{{ reply.content }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
