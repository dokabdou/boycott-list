services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pg-data-test:/var/lib/postgresql
    ports:
      - "5432:5432"   # optional, for local inspection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  migrate:
    image: python:3-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
      - ./backup_db:/app/backup_db
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: devdb
      DB_USERNAME: dev
      DB_PASSWORD: dev
      DUMP_DIR: /app/backup_db/clientdb
    command: >
      sh -c "pip install --quiet pymongo psycopg2-binary &&
             python /app/scripts/migrate_mongo_to_postgres.py"
    networks:
      - dev-net

networks:
  dev-net:

volumes:
  pg-data-test: