# docker-compose-test.yml
version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    networks:
      - testnet

  backend:
    image: boycott-list-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/clientdb
    networks:
      - testnet

networks:
  testnet:
    driver: bridge